<div>
  <h3>意見提交</h3>
  <p>歡迎留下你的建議，我會盡快與你聯繫。</p>
  <p>如要購買，請聯繫我的email，Facebook或Instagram帳號，提供你的需求與聯絡資訊，我會回覆你相關的購買流程與細節。</p>
  <form onsubmit="event.preventDefault(); alert('已收到你的建議，感謝回饋！');" class="mt-3">
    <div class="mb-3">
      <label for="adviseName" class="form-label">姓名</label>
      <input type="text" id="adviseName" class="form-control" placeholder="請輸入你的名字" required>
    </div>
    <div class="mb-3">
      <label for="adviseEmail" class="form-label">電子信箱</label>
      <input type="email" id="adviseEmail" class="form-control" placeholder="請輸入你的信箱" required>
    </div>
    <div class="mb-3">
      <label for="adviseMessage" class="form-label">建議內容</label>
      <textarea id="adviseMessage" class="form-control" rows="4" placeholder="請輸入你的建議或購買需求" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">送出建議</button>
  </form>
</div>
