<div class="art-page container">
  <div class="py-4">
    <h2>圖畫創作</h2>
    <p class="text-muted">這裡展示我的畫作系列，包含分類、作品展示與系統說明三大區塊。</p>
  </div>

  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="card art-panel h-100">
        <div class="card-header bg-primary text-white">分類</div>
        <div class="list-group list-group-flush art-category-list">
          <button type="button" class="list-group-item list-group-item-action active" data-series="dream" onclick="showArtSeries('dream')">夢境系列</button>
          <button type="button" class="list-group-item list-group-item-action" data-series="nature" onclick="showArtSeries('nature')">自然系列</button>
          <button type="button" class="list-group-item list-group-item-action" data-series="character" onclick="showArtSeries('character')">角色系列</button>
        </div>
      </div>
    </aside>

    <main class="col-lg-6">
      <div class="card art-panel h-100">
        <div class="card-header bg-secondary text-white">展示</div>
        <div class="card-body" id="artContent">
          <div class="art-title">
            <h3>歡迎來到圖畫創作空間</h3>
            <p class="text-muted">從左側分類中選擇一個系列，或從右側系統區段查看商品與服務。</p>
          </div>
          <div class="art-info-box">
            <p>這裡會展示畫作名稱由來、繪畫理念與系列故事。選擇不同系列會更新展示內容，讓你更了解每個作品的創作精神。</p>
          </div>
        </div>
      </div>
    </main>

    <aside class="col-lg-3">
      <div class="card art-panel h-100">
        <div class="card-header bg-warning text-dark">系統</div>
        <div class="card-body">
          <div class="mb-4 art-button-group">
            <h6>商品類別</h6>
            <button class="btn btn-outline-primary" onclick="showProductCategory('dream')">夢境系列</button>
            <button class="btn btn-outline-primary" onclick="showProductCategory('nature')">自然系列</button>
            <button class="btn btn-outline-primary" onclick="showProductCategory('character')">角色系列</button>
          </div>
          <div class="mb-4 art-button-group">
            <h6>說明</h6>
            <button class="btn btn-outline-secondary" onclick="loadArtInfo('introductionForProducts')">商品類別說明</button>
            <button class="btn btn-outline-secondary" onclick="loadArtInfo('introductionForBuying')">交易流程說明</button>
            <button class="btn btn-outline-secondary" onclick="loadArtInfo('givingAdvise')">意見提交</button>
            <button class="btn btn-outline-secondary" onclick="loadArtInfo('connectingWithUs')">聯絡資訊</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
if (typeof showArtSeries === 'function') {
  showArtSeries('dream');
}
</script>
